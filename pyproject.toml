[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retunnel"
version = "3.2.0"
description = "ReTunnel - Securely expose local servers to the internet"
authors = [{name = "ReTunnel Team", email = "support@retunnel.com"}]
license = "MIT"
readme = "README.md"
keywords = ["tunnel", "ngrok", "localhost", "webhook", "http", "https", "tcp", "reverse-proxy"]
requires-python = ">=3.9"
dependencies = [
    "aiohttp>=3.9.0",
    "multidict>=6.0.0",
    "yarl>=1.9.0",
    # The control connection uses the asyncio client that became the default
    # in 14.0 (max_size/open_timeout/ssl keywords); older releases had a
    # different connect() signature (audit #47 D6).
    "websockets>=14.0",
    "msgpack>=1.0.0",
    "click>=8.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=24.1.0",
    "typing-extensions>=4.0.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Networking",
    "Topic :: Internet :: WWW/HTTP",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "bandit>=1.8.3",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pytest-mock>=3.10.0",
    "aioresponses>=0.7.4",
    "types-aiofiles",
    "types-pyyaml",
    "ruff>=0.16.0",
]

[project.scripts]
retunnel = "retunnel.client.cli:cli"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "--cov=retunnel",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=10"
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]

[tool.black]
line-length = 79
target-version = ["py39"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 79
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
src_paths = ["retunnel", "tests"]

[tool.coverage.run]
source = ["retunnel"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.flake8]
max-line-length = 79
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "build", "dist", ".eggs", "*.egg"]

[tool.mypy]
python_version = "3.9"
strict = true

[[tool.mypy.overrides]]
module = "msgpack"
ignore_missing_imports = true

[tool.ruff]
# This package is published to PyPI and must import on Python 3.9, so the
# target version pins pyupgrade away from 3.10+ syntax. The bundled copy of the
# shared protocol library is linted here (rather than in retunnel-server, which
# targets 3.13) precisely because this is the strictest of the three copies.
target-version = "py39"
line-length = 79

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "B", "BLE", "ASYNC", "DTZ", "UP",
    "C4", "PIE", "RUF",
    "S110", "S112",
]
ignore = ["E501"]  # line length is black's job

[tool.ruff.lint.per-file-ignores]
# Network client: websockets/aiohttp raise many exception types; the tunnel
# must survive any transient I/O error without crashing. CLI commands must
# always surface a clean error message and a non-zero exit code.
"retunnel/client/client.py" = ["BLE001"]
"retunnel/client/cli.py" = ["BLE001"]
"retunnel/client/runner.py" = ["BLE001"]
# Stream handlers relay untrusted local apps over the network: any failure
# must end THAT stream (with a logged reset), never the process.
"retunnel/client/http_stream.py" = ["BLE001"]
"retunnel/client/ws_stream.py" = ["BLE001"]
"retunnel/client/tcp_stream.py" = ["BLE001"]
"retunnel/core/exceptions.py" = ["BLE001"]
# Pydantic v2 evaluates BaseModel annotations at runtime; `X | None` raises
# TypeError on Python 3.9, which this package still supports. Keep Optional[]
# in pydantic models even though pyupgrade prefers the 3.10+ syntax.
"retunnel/core/config.py" = ["UP045"]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "build>=1.2.2.post1",
    "flake8>=7.2.0",
    "isort>=6.0.1",
    "mypy>=1.16.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=0.23.0",
    "twine>=6.1.0",
    "types-aiofiles>=24.1.0.20250606",
    "types-pyyaml>=6.0.12.20250516",
    "ruff>=0.16.0",
]
